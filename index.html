<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peace Nature Empire Luxury Hair, Elevated</title>
<meta name="description" content="Peace Nature Empire — premium wigs and hair, hand-selected for texture, movement and shine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
<a href="#/" aria-label="Peace Nature Empire — home"
   style="
     display:flex;
     align-items:center;
     gap:12px;
     text-decoration:none;
     color:#1f3d2b;
     width:max-content;
     flex-shrink:0;
   ">

  <img src="/images/logo.jpeg"
       alt="Peace Nature Empire logo"
       style="
         width:52px;
         height:52px;
         object-fit:cover;
         border-radius:50%;
         display:block;
         border:2px solid #d4af37;
         box-shadow:0 3px 10px rgba(0,0,0,0.12);
       "
       onerror="this.style.display='none'">

  <span style="
    font-family:Georgia, 'Times New Roman', serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.3px;
    line-height:1.1;
    color:#1f3d2b;
    white-space:nowrap;
  ">
    Peace Nature Empire
  </span>

</a>
    <nav aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/shop" data-nav="shop">Shop</a>
      <a href="#/contact" data-nav="contact">Contact</a>
      <a href="#/cart" data-nav="cart">Cart <span id="cart-count" class="badge">0</span></a>
    </nav>
  </div>
</header>

<section class="edit-band reveal" data-home-only>
  <div class="edit-media">
    <img src="/images/hero.jpg" alt="" loading="lazy"
         onerror="this.style.opacity='0'">
  </div>
  <div class="edit-copy">
    <h2>Beauty, worn with intention</h2>
    
</section>

<main id="app" class="wrap"></main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="yr"></span> Peace Nature Empire</span>
    <span><a href="#/shop">Shop</a> &middot; <a href="#/contact">Contact</a> &middot; <a href="#/cart">Cart</a></span>
  </div>
</footer>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="script.js"></script>

<!-- Presentation-only helper. Does not touch cart, payment, product or
     routing logic — it only (1) flags the current route on <body> so the
     two static bands above can show/hide and reorder via CSS, and
     (2) reveals sections gently as they scroll into view, with a safe
     no-JS/no-support fallback of "just show everything". -->
<script>
(function () {
  function syncRoute() {
    var seg = location.hash.replace('#', '').split('/')[1] || '';
    document.body.setAttribute('data-route', seg === '' ? 'home' : seg);
  }
  window.addEventListener('hashchange', syncRoute);
  syncRoute();

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.18 });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
  }
})();
</script>
</body>
</html>
